[package]
name = "localman"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "localman"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "image"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"
tar = "0.4"
flate2 = "1"
rcgen = "0.13"
time = "0.3"
spake2 = "0.4"
chacha20poly1305 = "0.10"
sha2 = "0.10"
filetime = "0.2"
qrcode = { version = "0.14", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
